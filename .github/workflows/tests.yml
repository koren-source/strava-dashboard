name: Collector and training tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow expressions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m py_compile scripts/fetch-strava.py scripts/publish-history.py scripts/generate-recommendation.py training_plan.py
