name: Strava Sync & Training Plan

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours — same-day rides land faster
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: strava-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRAVA_CAPTURE_PATH: ${{ runner.temp }}/fitness-capture.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Strava data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/fetch-strava.py

      - name: Test training-plan logic
        run: python -m unittest discover -s tests

      - name: Generate training recommendation
        run: python scripts/generate-recommendation.py

      - name: Save complete private activity history
        env:
          FITNESS_CAPTURE_SECRET: ${{ secrets.FITNESS_CAPTURE_SECRET }}
        run: python scripts/publish-history.py

      - name: Commit and push if changed
        run: |
          git config user.name "strava-bot"
          git config user.email "strava-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: update Strava data [auto]" && git push)
